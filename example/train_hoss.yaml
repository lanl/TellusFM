# Fine-tune the pretrained TellusFM checkpoint on HOSS (finite-discrete element) data.
# Settings mirror the DI_fractures_hoss branch (train.py, s_parser.py defaults, sbatch.sh,
# dataloaders_single.py): all parameters trainable, relu + mean-MSE loss, lr 1e-4,
# 100000 samples per epoch, pbx only, random mesh displacement, fresh trainer state.
model_params:
  num_workers: 1
  num_nodes: 1               # branch: num_nodes=1 in the Trainer
  devices: 8                 # branch: devices=8 (set to 1 / accelerator: cpu for a local test)
  seed: 95
  batch_pixels: 10000
  lr: 0.0001                 # branch default (sbatch.sh does not override it)
  accum_grads: 64
  warmup_steps: 1000
  max_steps: 100000000
  gradient_clip_val: 0.5
  weight_decay: 0.01
  sim_type: 'HOSS'
  sim_weights:
    HOSS: 1.0
  accelerator: gpu
  space_bands: 32
  check_val_every_n_epoch: 1
  every_n_epochs: 1
  every_n_train_steps: 1000  # branch: checkpoint every 1000 steps
  flush_logs_every_n_steps: 10000
  number_samples_per_epoch: 100000   # branch: __len__ = 100000
  val_samples_per_sim: 1     # one validation pass per simulation (single orientation)
  path_working_directory: '.'

  # Field loss: MSE(relu(pred), target), averaged over points (hoss branch)
  loss_type: 'relu_mean'
  # Fine-tune all parameters (the hoss branch freezes nothing).
  # To freeze, list parameter-name substrings, e.g. [output_field, postproc_field].
  trainable: null

encoder:
  enc_preproc_ch: 512
  num_latents: 2048
  enc_num_latent_channels: 512
  num_layers: 3
  num_cross_attention_heads: 2
  enc_num_self_attention_heads: 2
  num_self_attention_layers_per_block: 3
  dropout: 0.0

decoder:
  dec_preproc_ch: 512
  dec_num_latent_channels: 512
  dec_num_cross_attention_heads: 1
  latent_size: 1

checkpoints:
  load_model_num: '../models/material_fracturing_model.ckpt'
  run_type: 'train'
  # branch: ckpt_path is commented out in trainer.fit, i.e. weights are loaded but the
  # optimizer / step / epoch state starts fresh
  resume_training: false

datasets:
  # HOSS link tables -- fill in once downloaded. Keys may be "Sample_<n>_frac_<m>" or
  # "link_frac_pull_z_<m>" (the format of the branch's pbx_frac_z.h5).
  path_hoss: '../data/hoss/external_links/train_link.h5'
  path_val_hoss: '../data/hoss/external_links/validation_link.h5'
  # HOSS meshes are in metres; coordinates are multiplied by this before encoding
  unstructured_mesh_scale: 1000.0
  # branch trains on pbx only (random.choice(['pbx']))
  hoss_materials: [pbx]
  # paper setup: horizontal only
  hoss_orientations: [horizontal]
  # branch: random mesh displacement of up to 0.0015 * 0.1 on training samples
  hoss_mesh_displacement: 0.00015

embeddings:
  # <mat>_finite-discrete element method_<orientation>_<i>.torch, i in 0..19
  emb_hoss: '../data/hoss/embeddings'
  num_embedding_variants: 20

# Evaluate a checkpoint on a new phase-field material (run_type: test).
#   python example/main.py --config example/test_new_material.yaml --log_filename test_new_material
model_params:
  num_workers: 0
  num_nodes: 1
  devices: 1
  seed: 95
  batch_pixels: 10000
  sim_type: 'PHASE'
  sim_weights:
    PHASE: 1.0
  accelerator: cpu
  space_bands: 32
  path_working_directory: '.'
  test_output_dir: 'test_new_material'
  # all: evaluate each z simulation in both orientations (horizontal and vertical) plus the combined (xz) ones;
  # the DI_fractures new_material validation did the same (3 loadings per simulation id)
  test_bc: all               # auto, vertical, horizontal, combined, all
  loss_type: 'sigmoid_sum'

encoder:
  enc_preproc_ch: 512
  num_latents: 2048
  enc_num_latent_channels: 512
  num_layers: 3
  num_cross_attention_heads: 2
  enc_num_self_attention_heads: 2
  num_self_attention_layers_per_block: 3
  dropout: 0.0

decoder:
  dec_preproc_ch: 512
  dec_num_latent_channels: 512
  dec_num_cross_attention_heads: 1
  latent_size: 1

checkpoints:
  load_model_num: '../models/new_material_finetuning.ckpt'    # replace with the fine-tuned checkpoint
  run_type: 'test'

datasets:
  path_test: '../data/phase_field/external_links_concrete/validation_link.h5'

embeddings:
  emb_phase: '../data/phase_field/embeddings'
  num_embedding_variants: 20
